packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "storybook"

onlyBuiltDependencies:
  - esbuild
  - sharp

allowBuilds:
  esbuild: true
  sharp: true

# Minimum patched versions for the advisories recorded in docs/release.md.
overrides:
  'postcss@<8.5.23': 8.5.23
  'ws@>=8 <8.21.0': 8.21.0
  'brace-expansion@>=2 <2.1.4': 2.1.4
  'sharp@<0.35.4': 0.35.4
  'nanoid@>=3 <3.3.18': 3.3.18
  'browserslist@<4.28.7': 4.28.7
  'baseline-browser-mapping@>=2 <2.11.0': 2.11.0
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  '@storybook/addon-actions>uuid': 11.1.1
